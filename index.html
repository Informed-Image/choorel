<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>choorel.com</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 0.75rem;
      text-decoration: none;
      color: #f8fafc;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.2s ease;
    }
    .link-card:hover {
      border-color: #38bdf8;
      background: #172554;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
    }
    .link-card span.badge {
      font-size: 0.8rem;
      font-weight: 500;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 0.25rem 0.6rem;
      border-radius: 0.4rem;
    }
    footer {
      margin-top: 2rem;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>choorel.com</h1>
    <p>Select a web app below to continue:</p>
    <div class="grid">
      <a class="link-card" href="/food/">
        <span>🍽️ AAO 2026 Food Guide</span>
        <span class="badge">Open</span>
      </a>
      <a class="link-card" href="/universal/">
        <span>🎢 AAO 2026 Ride Guide</span>
        <span class="badge">Open</span>
      </a>
      <a class="link-card" href="/parkle/">
        <span>🔤 Parkle Unlimited</span>
        <span class="badge">Play</span>
      </a>
    </div>
  </div>
  <footer>&copy; choorel.com</footer>
</body>
</html>
